<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="title desc">
  <title id="title">Control visible</title>
  <desc id="desc">Panel abstracto de control con barras y resumen circular.</desc>
